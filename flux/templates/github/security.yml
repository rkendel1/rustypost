name: Reqit Security Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  reqit-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (if present)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi
      - name: Validate generated tests and assertions
        run: node tests/scan.runner.js --security
