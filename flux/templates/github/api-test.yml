name: Reqit API Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reqit-api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (if present)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi
      - name: Run reqit generated tests
        run: node tests/scan.runner.js
